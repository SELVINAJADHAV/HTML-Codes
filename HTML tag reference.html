<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tag Reference</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8ed;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
            color: #b45f06;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 14px;
            text-align: left;
        }

        th {
            background: #fff0d4;
        }

        code {
            background: #f4f4f4;
            padding: 4px 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏷️ HTML Tag Reference</h1>

    <table>

        <tr>
            <th>HTML Tag</th>
            <th>Purpose</th>
            <th>Example</th>
        </tr>

        <tr>
            <td><code>&lt;h1&gt;</code></td>
            <td>Creates a main heading.</td>
            <td>Page Title</td>
        </tr>

        <tr>
            <td><code>&lt;p&gt;</code></td>
            <td>Creates a paragraph.</td>
            <td>Hello World</td>
        </tr>

        <tr>
            <td><code>&lt;a&gt;</code></td>
            <td>Creates a hyperlink.</td>
            <td>Visit Page</td>
        </tr>

        <tr>
            <td><code>&lt;img&gt;</code></td>
            <td>Displays an image.</td>
            <td>Photo</td>
        </tr>

        <tr>
            <td><code>&lt;table&gt;</code></td>
            <td>Creates a table.</td>
            <td>Student Data</td>
        </tr>

        <tr>
            <td><code>&lt;form&gt;</code></td>
            <td>Creates a form.</td>
            <td>Registration Form</td>
        </tr>

    </table>

</div>

</body>
</html>
